name: Stock Dashboard

on:
  schedule:
    # GitHub cron es UTC y no maneja DST. Disparamos a 08:00 y 09:00 UTC L-V;
    # el script (SCHEDULE_GUARD) solo continúa cuando en Madrid son las 10:00,
    # así el email llega a las 10:00 locales todo el año (verano e invierno).
    - cron: "0 8 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}        # ejecución manual (sin guard de hora) desde Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar dashboard y enviar email
        env:
          TARGET_TZ: "Europe/Madrid"
          TARGET_HOUR: "10"
          SCHEDULE_GUARD: ${{ github.event_name == 'schedule' }}
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py

      - name: Publicar dashboard web (commit de docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "Sin cambios en el dashboard."
          else
            git commit -m "chore: actualizar dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
